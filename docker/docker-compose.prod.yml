# ─────────────────────────────────────────────────────────────────────────────
# Omnijoy — production Docker Compose stack
#
# Usage:
#   make prod-up          build image + start all services
#   make prod-down        stop and remove containers
#   make prod-migrate     run EF Core migrations
#
# All services run on the internal 07ad0b82_omnijoy_net network.
# Only nginx publishes a host port (PUBLIC_PORT, default 80).
#
# Required env vars — copy docker/.env.example → docker/.env and fill in:
#   MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD, JWT_SECRET_KEY
# ─────────────────────────────────────────────────────────────────────────────
name: 07ad0b82_omnijoy

services:

  # ── MariaDB ─────────────────────────────────────────────────────────────────
  mysql:
    image: mariadb:11
    container_name: 07ad0b82_omnijoy_mysql
    restart: unless-stopped
    environment:
      # ${VAR:?msg} aborts `docker compose up` with the given message when the
      # variable is unset OR empty. Without this, compose silently substitutes
      # the empty string, MariaDB initialises with no password, and the
      # backend never connects (or — worse — the DB ends up world-writable).
      # See OMNIJOY-138.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in docker/.env}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-omnijoy}
      MYSQL_USER:          ${MYSQL_USER:-omnijoy}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in docker/.env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    networks:
      - omnijoy_net
    # No ports: section — DB is only reachable inside the Docker network.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── .NET Backend ─────────────────────────────────────────────────────────────
  backend:
    image: 07ad0b82_omnijoy_backend:latest
    container_name: 07ad0b82_omnijoy_backend
    build:
      context: ..          # repo root (needs both frontend/ and backend/)
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS:        http://+:5000

      # Override DB credentials from .env
      ConnectionStrings__DefaultConnection: >-
        Server=07ad0b82_omnijoy_mysql;Port=3306;
        Database=${MYSQL_DATABASE:-omnijoy};
        User=${MYSQL_USER:-omnijoy};
        Password=${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in docker/.env};
        AllowPublicKeyRetrieval=true;

      # JWT secret — MUST be set (min 32 chars)
      Jwt__Key: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in docker/.env (min 32 chars)}

      # CORS — set to your public domain in .env, e.g. https://omnijoy.example.com
      Cors__AllowedOrigins__0: ${CORS_ORIGINS:-}

      # Media storage inside the container (mounted to a named volume).
      # Used only when Storage__Type is left as "local". Kept as a fallback path.
      Media__StoragePath: /var/omnijoy/media

      # ── Object storage (S3 / MinIO) ─────────────────────────────────────────
      # Production stores media in the bundled MinIO container, exposed
      # publicly through nginx at /media/ (see nginx.prod.conf).
      # ServiceUrl uses the compose service name "minio" rather than the
      # container_name 07ad0b82_omnijoy_minio because some S3 clients reject
      # hostnames containing underscores per RFC 952/1123.
      Storage__Type:               s3
      Storage__S3__ServiceUrl:     http://minio:9000
      Storage__S3__BucketName:     ${MINIO_BUCKET:-omnijoy}
      # Fail-fast (${VAR:?msg}) — without this, a missing/empty MINIO_ROOT_USER
      # would silently substitute an empty string, the backend would build the
      # S3 client with empty credentials and send anonymous requests, and MinIO
      # would reply AccessDenied on every PutObject. See OMNIJOY-138.
      Storage__S3__AccessKey:      ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in docker/.env}
      Storage__S3__SecretKey:      ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in docker/.env}
      # Object URLs returned to clients are relative — served by nginx at /media/.
      Storage__S3__PublicBaseUrl:  /media

      # OAuth (optional)
      OAuth__Google__ClientId:     ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAuth__Google__ClientSecret: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAuth__Facebook__AppId:      ${OAUTH_FACEBOOK_APP_ID:-}
      OAuth__Facebook__AppSecret:  ${OAUTH_FACEBOOK_APP_SECRET:-}

      # Email / SMTP
      Email__SmtpHost:       ${SMTP_HOST:-localhost}
      Email__SmtpPort:       ${SMTP_PORT:-587}
      Email__FromAddress:    ${SMTP_FROM_ADDRESS:-noreply@omnijoy.local}
      Email__FromName:       ${SMTP_FROM_NAME:-Omnijoy}

      # Redis (SignalR backplane + distributed cache)
      Redis__ConnectionString: ${REDIS_CONNECTION:-07ad0b82_omnijoy_redis:6379}

      # Live streaming
      Live__RtmpHost:    07ad0b82_omnijoy_mediamtx
      Live__HlsBaseUrl:  http://07ad0b82_omnijoy_mediamtx:8888

      # ── Rate-limit overrides (optional) ────────────────────────────────────
      # Leave these unset to use the production defaults from RateLimitConstants
      # (20 uploads/hour per user, 10 strict-policy requests/min per IP,
      # 600 req/min per userId for the global limiter). Set RATELIMIT_* in
      # docker/.env when running `make test-e2e-prod` or when a particular
      # deployment needs different thresholds. The variables expand to the empty
      # string when unset, which the backend treats as "no override".
      RateLimiting__Upload__PermitLimit:   ${RATELIMIT_UPLOAD_PERMITS:-}
      RateLimiting__Upload__WindowSeconds: ${RATELIMIT_UPLOAD_WINDOW_SECONDS:-}
      RateLimiting__Strict__PermitLimit:   ${RATELIMIT_STRICT_PERMITS:-}
      RateLimiting__Strict__WindowSeconds: ${RATELIMIT_STRICT_WINDOW_SECONDS:-}
      RateLimiting__Global__UserPermitLimit: ${RATELIMIT_GLOBAL_USER_PERMITS:-}
      RateLimiting__Global__IpPermitLimit:   ${RATELIMIT_GLOBAL_IP_PERMITS:-}
    volumes:
      - media_data:/var/omnijoy/media
    networks:
      - omnijoy_net
    # No ports: section — backend only reachable via nginx inside the network.
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Nginx reverse proxy (the only public-facing container) ──────────────────
  nginx:
    image: nginx:alpine
    container_name: 07ad0b82_omnijoy_nginx
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-80}:80"
    environment:
      # Passed into the entrypoint so envsubst can expand ${MINIO_BUCKET} in
      # nginx.prod.conf.template before nginx starts. Keeps the bucket name
      # as a single source of truth in docker/.env.
      MINIO_BUCKET: ${MINIO_BUCKET:-omnijoy}
    volumes:
      - ./nginx.prod.conf.template:/etc/nginx/nginx.conf.template:ro,z
    # envsubst replaces ${MINIO_BUCKET} in the template and writes the final
    # nginx.conf before starting nginx. Only MINIO_BUCKET is substituted —
    # all other nginx $variables ($host, $remote_addr, etc.) are left intact.
    entrypoint:
      - /bin/sh
      - -c
      - "envsubst '$$MINIO_BUCKET' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"
    networks:
      - omnijoy_net
    depends_on:
      - backend

  # ── Redis (SignalR backplane + distributed cache) ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: 07ad0b82_omnijoy_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks:
      - omnijoy_net
    # No ports: section — Redis is only reachable inside the Docker network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible object store for media) ────────────────────────────
  # No host port is published — nginx proxies /media/* to this container
  # internally over the omnijoy_net network.
  minio:
    image: minio/minio:latest
    container_name: 07ad0b82_omnijoy_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in docker/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in docker/.env}
    volumes:
      - minio_data:/data
    networks:
      - omnijoy_net
    # curl is no longer shipped in the minio image; mc is bundled and
    # `mc ready local` is the upstream-recommended healthcheck.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-shot init: creates the bucket on first run (idempotent) and opens it
  # for anonymous public read so that object URLs proxied by nginx work
  # without signed requests.
  minio-init:
    image: minio/mc:latest
    container_name: 07ad0b82_omnijoy_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - omnijoy_net
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in docker/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in docker/.env}
      MINIO_BUCKET:        ${MINIO_BUCKET:-omnijoy}
    # mc rejects hostnames with underscores, so we use the compose service
    # name "minio" (a clean DNS alias on the omnijoy_net network) instead
    # of the container_name 07ad0b82_omnijoy_minio.
    entrypoint: >
      /bin/sh -c "
      set -e;
      until mc alias set omnijoy http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1; do
        echo 'waiting for minio...'; sleep 1;
      done;
      mc mb --ignore-existing omnijoy/\"$$MINIO_BUCKET\";
      mc anonymous set download omnijoy/\"$$MINIO_BUCKET\";
      echo 'minio bucket ready';
      "
    restart: "no"

  # ── MediaMTX (RTMP ingest / HLS delivery for live streams) ──────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: 07ad0b82_omnijoy_mediamtx
    restart: unless-stopped
    environment:
      # MTX_PATHS_ALL_SOURCE is intentionally omitted.
      # The MediaMTX Docker image ships with a default config that already
      # defines 'all_others' (the catch-all path) with source=publisher.
      # Defining MTX_PATHS_ALL_SOURCE adds a second entry for the alias
      # 'all' (which is the same as 'all_others' and '~^.*$'), causing the
      # repeated error: "all_others, all and '~^.*$' are aliases".
      MTX_HLSADDRESS:  :8888
      MTX_RTMPADDRESS: :1935
    ports:
      # RTMP ingest: OBS → rtmp://HOST:RTMP_PORT/live/STREAM_KEY
      - "${RTMP_PORT:-1935}:1935"
      # HLS is accessed internally through the backend proxy — not published.
    networks:
      - omnijoy_net

networks:
  omnijoy_net:
    name: 07ad0b82_omnijoy_net
    driver: bridge

volumes:
  mysql_data:
    name: 07ad0b82_omnijoy_mysql_data
  media_data:
    name: 07ad0b82_omnijoy_media_data
  minio_data:
    name: 07ad0b82_omnijoy_minio_data
